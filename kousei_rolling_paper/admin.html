<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#243f55">
<title>ROLLING PAPER · ADMIN</title>
<style>
:root{--bg:#101b27;--panel:#172637;--panel2:#1e3144;--line:#30495f;--text:#eef6fb;--muted:#8ea4b6;--blue:#55b7e6;--red:#ef7580}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0b1520,#152638);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh}
button,input,select{font:inherit}
.wrap{width:min(1050px,calc(100% - 24px));margin:0 auto;padding:35px 0 70px}
.head{display:flex;justify-content:space-between;gap:15px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:18px}
.en{font-size:10px;letter-spacing:.18em;color:#68b7df;font-weight:900}.head h1{margin:5px 0 0}.head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:var(--panel2);color:var(--text);font-weight:900;cursor:pointer}
.btn.primary{background:#174863;border-color:#4388a9}.btn.danger{background:#512733;border-color:#a74959;color:#ffdce1}
.login{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:18px}
.login-row{display:grid;grid-template-columns:1fr 1fr auto;gap:9px}.login input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#0e1a26;color:white}
.status{font-size:11px;color:#f3a1ab;min-height:18px;margin-top:8px}
.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.toolbar select,.toolbar input{padding:11px;border:1px solid var(--line);border-radius:11px;background:#122131;color:white}
.cards{display:grid;gap:11px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;display:grid;grid-template-columns:1fr auto;gap:14px}
.meta{font-size:11px;color:#8eabbc}.names{font-weight:900;margin:4px 0 8px}.message{white-space:pre-wrap;line-height:1.65;font-size:13px;color:#e5eef4}
.empty{text-align:center;padding:80px 20px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:18px}
.badge{display:inline-block;border:1px solid #385a70;background:#143149;border-radius:999px;padding:4px 8px;font-size:9px;color:#93cae6;margin-right:5px}
@media(max-width:650px){.login-row{grid-template-columns:1fr}.card{grid-template-columns:1fr}.card .btn{width:100%}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="wrap">
 <header class="head">
  <div><div class="en">KOUSEI · PRIVATE ADMIN</div><h1>롤링페이퍼 관리</h1><p>GM 계정으로 로그인한 뒤 잘못 등록된 쪽지를 삭제할 수 있습니다.</p></div>
  <a class="btn" href="index.html" style="text-decoration:none">← 롤링페이퍼</a>
 </header>

 <section class="login">
  <div class="login-row">
    <input id="email" value="gm@kousei.local" placeholder="GM 이메일">
    <input id="password" type="password" placeholder="GM 비밀번호">
    <button class="btn primary" id="loginBtn">GM 로그인</button>
  </div>
  <div class="status" id="loginStatus"></div>
 </section>

 <section id="adminArea" hidden>
  <div class="toolbar">
    <div>
      <select id="recipientFilter"><option value="">전체 학생</option></select>
      <input id="search" placeholder="작성자 · 내용 검색">
    </div>
    <div style="font-size:11px;color:#9fb3c0"><span id="count">0</span>개 쪽지</div>
  </div>
  <div class="cards" id="cards"></div>
 </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="assets/js/students.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script>
const $=id=>document.getElementById(id), S=window.KOUSEI_STUDENTS;
const c=window.KOUSEI_FIREBASE_CONFIG||{};
let db=null,auth=null,all=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function studentName(id){const s=S.find(x=>x.id===id);return s?`${s.grade}학년 ${s.className}반 ${s.nameKR}`:id}

if(c.apiKey && !c.apiKey.includes('PASTE_')){
 firebase.initializeApp(c);auth=firebase.auth();db=firebase.database();
 auth.onAuthStateChanged(u=>{
   const isGM=!!u && u.email==='gm@kousei.local';
   $('adminArea').hidden=!isGM;
   $('loginStatus').textContent=isGM?'GM 로그인 완료.':'';
   if(isGM) loadAll();
 });
}else{
 $('loginStatus').textContent='firebase-config.js에 API Key가 설정되지 않았습니다.';
}

$('recipientFilter').innerHTML='<option value="">전체 학생</option>'+S.map(s=>`<option value="${s.id}">${s.grade}학년 ${s.className}반 ${s.nameKR}</option>`).join('');

$('loginBtn').onclick=async()=>{
 if(!auth){$('loginStatus').textContent='Firebase 설정을 먼저 확인해 주세요.';return}
 try{
  $('loginStatus').textContent='로그인 중…';
  const cred=await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);
  if(cred.user.email!=='gm@kousei.local'){
    await auth.signOut();throw new Error('NOT_GM');
  }
 }catch(e){$('loginStatus').textContent='GM 계정으로 로그인할 수 없습니다.'}
};

function loadAll(){
 db.ref('rollingPapers').on('value',snap=>{
   all=[];
   snap.forEach(rec=>{
     rec.forEach(msg=>all.push({recipientId:rec.key,messageId:msg.key,...msg.val()}));
   });
   all.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
   render();
 });
}
function render(){
 const r=$('recipientFilter').value,q=$('search').value.trim().toLowerCase();
 const list=all.filter(x=>(!r||x.recipientId===r)&&(!q||`${x.message} ${x.senderNameJP} ${x.senderNameKR} ${studentName(x.recipientId)}`.toLowerCase().includes(q)));
 $('count').textContent=list.length;
 if(!list.length){$('cards').innerHTML='<div class="empty">표시할 쪽지가 없습니다.</div>';return}
 $('cards').innerHTML=list.map(x=>`<article class="card">
   <div>
    <div class="meta"><span class="badge">TO</span>${esc(studentName(x.recipientId))}</div>
    <div class="names">FROM · ${esc(x.senderNameJP)} · ${esc(x.senderNameKR)}</div>
    <div class="message">${esc(x.message)}</div>
   </div>
   <div><button class="btn danger" data-del="${esc(x.recipientId)}|${esc(x.messageId)}">삭제</button></div>
 </article>`).join('');
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
   const [rid,mid]=b.dataset.del.split('|');
   const item=all.find(x=>x.recipientId===rid&&x.messageId===mid);
   if(!confirm(`이 쪽지를 삭제할까요?\n\n${item?.senderNameKR||''} → ${studentName(rid)}\n${item?.message||''}`))return;
   try{await db.ref(`rollingPapers/${rid}/${mid}`).remove();}
   catch(e){alert('삭제에 실패했습니다. Firebase Rules의 GM 삭제 권한을 확인해 주세요.');}
 });
}
$('recipientFilter').onchange=render;$('search').oninput=render;
</script>
</body>
</html>
