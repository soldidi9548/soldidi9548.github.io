<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>코우세이 축제 뽑기소</title><style>body{margin:0;font-family:Arial,sans-serif;background:#fff7e7;color:#28334a}.wrap{max-width:700px;margin:auto;padding:42px 22px}.back{text-decoration:none;color:#627089}.panel{margin-top:28px;background:#fff;border:2px solid #f0d79d;border-radius:26px;padding:34px;text-align:center}.machine{font-size:80px}.slot{font-size:24px;font-weight:900;margin:24px 0;padding:24px;background:#fff9ef;border-radius:18px}.btn{border:0;background:#d25d55;color:white;border-radius:999px;padding:14px 22px;font-weight:900;cursor:pointer}.note{color:#7d8797;line-height:1.6}</style></head><body><div class="wrap"><a class="back" href="../../index.html">← 축제 메인</a><div class="panel"><div class="machine">🎯</div><h1>光星くじ引き所</h1><p class="note">오늘의 경품 또는 작은 축제 미션을 한 번 뽑아보세요.</p><div class="slot" id="slot">무엇이 나올까?</div><button class="btn" id="go">뽑기!</button></div></div><script>const prizes=['🍧 빙수 교환권 — RP에서 원하는 빙수 하나 받기','🎆 불꽃놀이 명당권 — 같이 보고 싶은 사람 한 명에게 먼저 말 걸기','📷 기념사진권 — 오늘 사진 한 장 남기기','🍬 사탕 한 봉지 — 아무에게나 작은 간식 선물하기','🌊 꽝! 대신 바닷가를 한 바퀴 산책하기','🎐 축제 부채 — 가장 마음에 든 부스 하나 추천하기'];go.onclick=()=>{slot.textContent=prizes[Math.floor(Math.random()*prizes.length)];window.KOUSEI_ENABLE_STAMP&&window.KOUSEI_ENABLE_STAMP()}</script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="../../assets/js/firebase-config.js"></script><script>window.KOUSEI_BOOTH_STAMP={id:'lottery',title:'光星くじ引き所'};</script><script src="../../assets/js/stamp-booth.js"></script></body></html>
