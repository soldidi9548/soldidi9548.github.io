<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여름 축제 오미쿠지</title><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#dff4ff,#fff5e9);min-height:100vh;color:#26334a}.wrap{max-width:680px;margin:auto;padding:40px 22px}.back{color:#526b85;text-decoration:none}.card{margin-top:26px;background:#fff;border-radius:26px;padding:34px;text-align:center;box-shadow:0 14px 40px #4562  }.icon{font-size:56px}h1{margin:12px 0 6px}.sub{color:#7d899a}.result{margin:25px 0;padding:24px;border:1px dashed #e1bd98;border-radius:18px;background:#fffaf5}.grade{font-size:38px;font-family:serif;font-weight:900}.item{margin-top:12px;color:#6c7788}.btn{border:0;background:#304560;color:#fff;padding:14px 22px;border-radius:999px;font-weight:800;cursor:pointer}</style></head><body><div class="wrap"><a class="back" href="../../index.html">← 축제 메인</a><div class="card"><div class="icon">🎐</div><div class="sub">光星高校 祭実行委員会</div><h1>夏祭りおみくじ</h1><p>오늘의 축제 운세를 한 장 뽑아보세요.</p><div class="result" id="result"><div class="grade">?</div><div>버튼을 눌러 운세를 확인하세요.</div></div><button class="btn" id="draw">오미쿠지 뽑기</button></div></div><script>const data=[['大吉','오늘은 먼저 말을 걸수록 행운이 커집니다.','행운 아이템 · 파란 음료'],['中吉','예상치 못한 사람과 좋은 대화를 나눌지도 몰라요.','행운 아이템 · 사진 한 장'],['小吉','조용히 둘러보다 마음에 드는 부스를 발견할 운세.','행운 아이템 · 작은 간식'],['吉','친구와 함께 움직이면 좋은 일이 생깁니다.','행운 아이템 · 부채'],['末吉','서두르지 말고 천천히 축제를 즐겨보세요.','행운 아이템 · 바닷바람']];draw.onclick=()=>{const x=data[Math.floor(Math.random()*data.length)];result.innerHTML=`<div class="grade">${x[0]}</div><p>${x[1]}</p><div class="item">${x[2]}</div>`;window.KOUSEI_ENABLE_STAMP&&window.KOUSEI_ENABLE_STAMP()}</script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="../../assets/js/firebase-config.js"></script><script>window.KOUSEI_BOOTH_STAMP={id:'omikuji',title:'夏祭りおみくじ'};</script><script src="../../assets/js/stamp-booth.js"></script></body></html>
