<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여름의 한마디 카드</title><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(160deg,#dff4ff,#fff,#ffe9ef);min-height:100vh;color:#29354a}.wrap{max-width:720px;margin:auto;padding:40px 22px}.back{text-decoration:none;color:#64748b}.panel{margin-top:28px;background:#ffffffd9;border-radius:28px;padding:34px;box-shadow:0 18px 45px #5262}.card{margin:24px 0;background:#fff;border:1px solid #dfe8ef;border-radius:22px;padding:28px;min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:23px;line-height:1.6;font-weight:800}.btn{display:block;margin:auto;border:0;background:#405a7a;color:#fff;border-radius:999px;padding:14px 22px;font-weight:900;cursor:pointer}.tip{text-align:center;color:#7f8a9b;font-size:13px}</style></head><body><div class="wrap"><a class="back" href="../../index.html">← 축제 메인</a><div class="panel"><div style="font-size:48px;text-align:center">📮</div><h1 style="text-align:center">夏の思い出カード</h1><p class="tip">카드에 나온 내용을 축제 RP 소재로 사용해 보세요.</p><div class="card" id="card">카드를 한 장 뽑아보세요.</div><button class="btn" id="draw">카드 뽑기</button></div></div><script>const cards=['지금 가장 먼저 떠오르는 사람에게 “같이 뭐 먹으러 갈래?” 하고 말해보기.','아직 함께 사진을 찍지 않은 사람 한 명과 축제 기념사진 남기기.','부스 하나를 골라 누군가를 데리고 같이 방문하기.','마주친 사람에게 오늘 축제에서 가장 기대되는 것이 무엇인지 물어보기.','바닷가에서 잠깐 쉬면서 옆 사람과 여름에 대한 이야기를 나누기.','지금 같이 있는 사람에게 가장 마음에 든 부스를 하나 추천받기.'];draw.onclick=()=>{card.textContent=cards[Math.floor(Math.random()*cards.length)];window.KOUSEI_ENABLE_STAMP&&window.KOUSEI_ENABLE_STAMP()}</script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="../../assets/js/firebase-config.js"></script><script>window.KOUSEI_BOOTH_STAMP={id:'summer-card',title:'夏の思い出カード'};</script><script src="../../assets/js/stamp-booth.js"></script></body></html>
