<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
<style>
  .bg{fill:#08110e}.grid{stroke:#c7e7b4;stroke-opacity:.035;stroke-width:1}
  .line{stroke:#71837a;stroke-width:2.2;fill:none;vector-effect:non-scaling-stroke}
  .box{fill:#101916;stroke:#71837a;stroke-width:1.7;rx:12}
  .hub{fill:#dfe9e2;stroke:#dfe9e2}.hubtext{fill:#07100b}
  .label{fill:#f0f6f2;font:800 24px 'Noto Sans KR',Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
  .floor{fill:#c7e7b4;font:700 40px Georgia,serif;text-anchor:middle;dominant-baseline:middle}
  .small{fill:#83968b;font:12px monospace;letter-spacing:3px;text-anchor:middle}
  .danger{fill:#160d0f;stroke:#a34d52;stroke-dasharray:8 7}.dangertext{fill:#dd777c}
</style>
<rect class="bg" width="1800" height="1050"/>
<g opacity=".58">
  <path class="grid" d="M0 50H1800M0 100H1800M0 150H1800M0 200H1800M0 250H1800M0 300H1800M0 350H1800M0 400H1800M0 450H1800M0 500H1800M0 550H1800M0 600H1800M0 650H1800M0 700H1800M0 750H1800M0 800H1800M0 850H1800M0 900H1800M0 950H1800M0 1000H1800"/>
  <path class="grid" d="M50 0V1050M100 0V1050M150 0V1050M200 0V1050M250 0V1050M300 0V1050M350 0V1050M400 0V1050M450 0V1050M500 0V1050M550 0V1050M600 0V1050M650 0V1050M700 0V1050M750 0V1050M800 0V1050M850 0V1050M900 0V1050M950 0V1050M1000 0V1050M1050 0V1050M1100 0V1050M1150 0V1050M1200 0V1050M1250 0V1050M1300 0V1050M1350 0V1050M1400 0V1050M1450 0V1050M1500 0V1050M1550 0V1050M1600 0V1050M1650 0V1050M1700 0V1050M1750 0V1050"/>
</g>
<text x="900" y="38" class="small">FACILITY MOVEMENT GUIDE</text>
<text x="900" y="63" class="small" style="font-size:10px;letter-spacing:1px">복도와 계단을 따라 연결된 공간만 이동할 수 있습니다</text>

<!-- stair shaft -->
<path class="line" d="M300 170V820"/>

<!-- 3F -->
<text x="92" y="205" class="floor">3F</text>
<rect x="190" y="150" width="220" height="110" class="box"/><text x="300" y="205" class="label">3층 계단</text>
<path class="line" d="M410 205H640"/>
<rect x="640" y="150" width="260" height="110" class="box hub"/><text x="770" y="205" class="label hubtext">3층 복도</text>
<path class="line" d="M900 205H1130M1130 205L1280 135M1130 205H1280M1130 205L1280 275"/>
<rect x="1280" y="90" width="420" height="90" class="box"/><text x="1490" y="135" class="label">병실</text>
<rect x="1280" y="160" width="420" height="90" class="box"/><text x="1490" y="205" class="label">상담실</text>
<rect x="1280" y="230" width="420" height="90" class="box"/><text x="1490" y="275" class="label">휴게실</text>

<!-- 2F -->
<text x="92" y="485" class="floor">2F</text>
<rect x="190" y="430" width="220" height="110" class="box"/><text x="300" y="485" class="label">2층 계단</text>
<path class="line" d="M410 485H640"/>
<rect x="640" y="430" width="260" height="110" class="box hub"/><text x="770" y="485" class="label hubtext">2층 복도</text>
<path class="line" d="M900 485H1130M1130 485L1280 365M1130 485L1280 445M1130 485L1280 525M1130 485L1280 605"/>
<rect x="1280" y="320" width="420" height="90" class="box"/><text x="1490" y="365" class="label">면담실</text>
<rect x="1280" y="400" width="420" height="90" class="box"/><text x="1490" y="445" class="label">약품실</text>
<rect x="1280" y="480" width="420" height="90" class="box"/><text x="1490" y="525" class="label">검사실</text>
<rect x="1280" y="560" width="420" height="90" class="box"/><text x="1490" y="605" class="label">격리실</text>

<!-- 1F exact structure -->
<text x="92" y="790" class="floor">1F</text>
<rect x="190" y="735" width="220" height="110" class="box"/><text x="300" y="790" class="label">1층 계단</text>
<path class="line" d="M410 790H530V710H700"/>
<rect x="700" y="655" width="250" height="110" class="box hub"/><text x="825" y="710" class="label hubtext">로비</text>
<rect x="1120" y="655" width="250" height="110" class="box"/><text x="1245" y="710" class="label">원무과</text>
<rect x="700" y="830" width="250" height="110" class="box"/><text x="825" y="885" class="label">안내 데스크</text>
<rect x="1120" y="830" width="250" height="110" class="box"/><text x="1245" y="885" class="label">현관</text>
<path class="line" d="M950 710H1120M825 765V830M1245 765V830M950 885H1120M950 710L1120 885M1120 710L950 885"/>
<text x="1035" y="975" class="small" style="letter-spacing:1px">1층 홀 · 네 공간 사이 자유 이동</text>

<!-- underground hint -->
<path class="line" d="M300 845V935"/>
<rect x="190" y="930" width="220" height="82" class="box danger"/><text x="300" y="971" class="label dangertext">XX</text>
<path class="line" d="M300 1012V1050"/>
</svg>
