<style>
.bg{fill:#09110e}.grid{stroke:#c7e7b4;stroke-opacity:.035;stroke-width:1}.line{stroke:#6c8176;stroke-width:2.2;fill:none}.box{fill:#101916;stroke:#6c8176;stroke-width:1.7;rx:9}.hub{fill:#dce8df;stroke:#dce8df}.label{fill:#f2f7f3;font:700 22px 'Noto Sans KR',Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.hubtext{fill:#07100b}.floor{fill:#b9daa7;font:700 32px Georgia,serif;text-anchor:middle;dominant-baseline:middle}.small{fill:#7f9188;font:12px monospace;letter-spacing:2px;text-anchor:middle}.danger{fill:#160d0f;stroke:#91464b;stroke-dasharray:8 6}.dangertext{fill:#df7f84}
</style>
