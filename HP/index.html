<!doctype html>
<html lang="ko">
<head>

  <template id="window-template">

      <header class="window-titlebar">
        <span class="window-title"></span>
        <div class="window-controls"><button data-act="min">_</button><button data-act="max">□</button><button data-act="close">×</button></div>
