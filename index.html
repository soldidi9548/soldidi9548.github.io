<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>디디의 사과 상자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  --red:#D7263D; --red-deep:#A3172C; --leaf:#4E9A4B;
  --yellow:#FFF4C2; --butter:#FFE27A;
  --paper:#FFFFFF; --ink:#3B1418; --soft:#86555A; --line:#F2CFC6;
  --check:rgba(215,38,61,.13); --red-soft:#EC8E9A;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --pixel:"Silkscreen","Jua",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --red:#E8394F; --red-deep:#7E0F1F; --yellow:#2E1513; --butter:#E5C24E;
    --paper:#3A1A1C; --ink:#FFF3DA; --soft:#E5BCA8; --line:#5D2C2F; --check:rgba(232,57,79,.18); --red-soft:#6E2C33;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --red:#E8394F; --red-deep:#7E0F1F; --yellow:#2E1513; --butter:#E5C24E;
  --paper:#3A1A1C; --ink:#FFF3DA; --soft:#E5BCA8; --line:#5D2C2F; --check:rgba(232,57,79,.18); --red-soft:#6E2C33;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;background:var(--red)}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--body);line-height:1.65;-webkit-font-smoothing:antialiased;
  background:
    linear-gradient(90deg,var(--check) 50%,transparent 50%) 0 0/48px 48px,
    linear-gradient(var(--check) 50%,transparent 50%) 0 0/48px 48px,
    var(--yellow)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
.hidden,[hidden]{display:none!important}

/* ---------- login ---------- */
.login{position:fixed;inset:0;display:grid;place-items:center;padding:1rem;z-index:30;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.win{background:var(--paper);border:3px solid var(--red);border-radius:14px;box-shadow:6px 6px 0 var(--red-deep);display:flex;flex-direction:column;overflow:hidden}
.titlebar{display:flex;align-items:center;gap:.5rem;background:var(--red);color:#fff;padding:.4rem .5rem .4rem .8rem;font-family:var(--pixel);font-size:.9rem;user-select:none;flex:none}
.titlebar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{appearance:none;border:2px solid #fff;background:transparent;color:#fff;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;cursor:pointer;padding:0;font-family:var(--pixel);font-size:.8rem;line-height:1}
.tb-btn:hover{background:rgba(255,255,255,.2)}
.login .win{width:min(360px,100%)}
.login-body{padding:1.6rem 1.4rem 1.3rem;display:grid;gap:.8rem;justify-items:center}
.login-body svg.logo{width:84px;height:84px}
.login-body h1{margin:0;font-family:var(--display);font-weight:400;font-size:1.9rem;color:var(--red);line-height:1.1}
.lf{width:100%;display:grid;gap:.25rem}
.lf span{font-family:var(--pixel);font-size:.75rem;color:var(--soft)}
.lf input{width:100%;border:2px solid var(--line);border-radius:9px;background:var(--yellow);padding:.55rem .7rem;font-size:16px;outline:none}
.lf input:focus{border-color:var(--red)}
.pbtn{appearance:none;border:2px solid var(--red-deep);background:var(--red);color:#fff;font-family:var(--pixel);font-size:.95rem;padding:.55rem 1.2rem;border-radius:9px;cursor:pointer;box-shadow:0 3px 0 var(--red-deep)}
.pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-deep)}
.pbtn.ghost{background:var(--paper);color:var(--red);border-color:var(--red);box-shadow:0 3px 0 var(--line)}
.login .pbtn{width:100%}
.status{width:100%;font-family:var(--pixel);font-size:.75rem;color:var(--soft);display:grid;gap:.35rem}
.meter{height:12px;border:2px solid var(--red);border-radius:6px;overflow:hidden;background:var(--yellow)}
.meter i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--red) 0 10px,transparent 10px 13px);transition:width 1.1s steps(12)}

/* ---------- desktop ---------- */
.app{height:100%;display:grid;grid-template-rows:1fr auto}
.desk{position:relative;z-index:1;min-height:0;padding:1rem}
.icons{display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,96px);gap:.4rem;height:100%;align-content:start;justify-content:start}
.ico{appearance:none;border:0;background:transparent;width:88px;padding:.35rem .2rem;border-radius:12px;display:grid;justify-items:center;gap:.25rem;cursor:pointer;color:var(--ink)}
.ico .box{width:52px;height:52px;border-radius:14px;background:var(--paper);border:2.5px solid var(--red);box-shadow:3px 3px 0 var(--red-deep);display:grid;place-items:center}
.ico .box svg{width:28px;height:28px}
.ico .lbl{font-family:var(--display);font-size:.95rem;line-height:1.2;padding:.05rem .4rem;border-radius:6px;background:var(--paper);text-align:center}
.ico:hover .box{transform:translateY(-2px)}
.ico[aria-current="true"] .lbl{background:var(--red);color:#fff}

/* windows */
.wins{position:absolute;inset:0;pointer-events:none}
.appwin{contain:layout;position:absolute;pointer-events:auto;min-width:280px;min-height:220px;resize:both;animation:pop .18s ease-out}
.appwin.closing{animation:shut .14s ease-in forwards}
.appwin.mini{display:none}
.appwin.fit{height:auto;max-height:100%}
.appwin.max{left:0!important;top:0!important;width:100%!important;height:100%!important;resize:none}
.appwin .titlebar{cursor:grab;touch-action:none}
.appwin.dragging .titlebar{cursor:grabbing}
.appwin.inactive{box-shadow:4px 4px 0 var(--line);border-color:var(--red-soft)}
.appwin.inactive .titlebar{background:var(--red-soft)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
@keyframes shut{to{transform:scale(.9);opacity:0}}
.pane{--pt:1.4rem;--px:1.5rem;--pb:2rem;flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:var(--pt) var(--px) var(--pb);container-type:inline-size}
.pane h2{margin:0 0 1rem;font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,4vw,2.1rem);color:var(--red);line-height:1.2}
.pane .sub{margin:0 0 1.2rem;color:var(--soft);font-size:.95rem}

/* about */
.pcard{margin:calc(-1 * var(--pt)) calc(-1 * var(--px)) calc(-1 * var(--pb));text-align:center}
.pbody{padding:0 var(--px) calc(1.3rem + 3px)}
.pinfo{max-width:440px;margin:0 auto}
.pband{height:170px;display:flex;justify-content:center;align-items:flex-start;padding:1.3rem 1rem 0;border-bottom:3px solid var(--red);background:
  linear-gradient(90deg,rgba(255,255,255,.35) 50%,transparent 50%) 0 0/28px 28px,
  linear-gradient(rgba(255,255,255,.35) 50%,transparent 50%) 0 0/28px 28px,var(--red)}
.pavatar{width:172px;height:172px;margin:-86px auto 0;border-radius:50%;border:4px solid var(--red);background:#fff;overflow:hidden;box-shadow:0 0 0 5px var(--paper)}
.pavatar img{width:100%;height:100%;object-fit:cover;display:block}
.pane h2.pname{margin:1rem 0 .6rem;font-size:2rem;color:var(--ink)}
.pchips{display:flex;justify-content:center;flex-wrap:wrap;gap:.35rem;padding:0 1rem}
.pchips span{font-family:var(--display);font-size:.92rem;padding:.15rem .7rem;border-radius:999px;background:var(--butter);color:#3B1418}
.psay{position:relative;margin:0;padding:.55rem 1.2rem;border:2.5px solid #A3172C;border-radius:14px;background:#FFF7CF;font-family:var(--display);font-size:1.15rem;line-height:1.3;color:#D7263D;box-shadow:3px 3px 0 #A3172C}
.psay::before{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:#FFF7CF;border-right:2.5px solid #A3172C;border-bottom:2.5px solid #A3172C;transform:translateX(-50%) rotate(45deg)}
.plinks{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1.6rem}
@container (min-width:560px){
  .pcard{text-align:left}
  .pband{height:190px;justify-content:flex-start;padding-left:2rem}
  .pbody{display:grid;grid-template-columns:auto 1fr;column-gap:1.75rem;align-items:start;padding:0 2rem calc(1.3rem + 3px)}
  .pavatar{width:176px;height:176px;margin:-88px 0 0}
  .pinfo{margin:0;max-width:480px;padding-top:1.4rem}
  .pane h2.pname{margin:0 0 .5rem;font-size:2.3rem;line-height:1.1}
  .pchips{justify-content:flex-start;padding:0}
  .psay::before{left:84px}
}
.plink{display:grid;justify-items:center;gap:.25rem;padding:.7rem .3rem .6rem;border:2.5px solid var(--red);border-radius:12px;background:var(--paper);color:var(--red);text-decoration:none;font-family:var(--display);font-size:.95rem;box-shadow:0 3px 0 var(--red-deep)}
.plink svg{width:24px;height:24px}
.plink:hover{background:var(--red);color:#fff}
.plink:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-deep)}

/* sub tabs */
.subtabs{display:inline-flex;gap:4px;padding:4px;border:2.5px solid var(--red);border-radius:12px;background:var(--yellow);margin-bottom:1.1rem}
.subtabs button{appearance:none;border:0;background:transparent;font-family:var(--display);font-size:1rem;padding:.4rem 1rem;border-radius:8px;cursor:pointer}
.subtabs button[aria-selected="true"]{background:var(--red);color:#fff}

/* grid cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem}
.card{appearance:none;text-align:left;cursor:pointer;padding:0;background:var(--paper);border:2.5px solid var(--red);border-radius:14px;box-shadow:4px 4px 0 var(--red-deep);overflow:hidden;display:flex;flex-direction:column}
.card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--red-deep)}
.ph{aspect-ratio:4/5;background:radial-gradient(circle at 25% 25%,var(--butter) 0 5px,transparent 6px) 0 0/30px 30px,var(--yellow);display:grid;place-items:center;border-bottom:2.5px solid var(--red)}
.ph svg{width:40px;height:40px;opacity:.5}
.card .cb{padding:.6rem .75rem .75rem}
.ph.cover{aspect-ratio:1;display:block;background:var(--yellow)}
.ph.cover img,.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.grid.works{grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem}
.grid.works .cb{padding:.5rem .6rem .6rem}
.grid.works .card b{font-size:.95rem;line-height:1.3}
.grid.works .card small{font-size:.78rem}
@container (max-width:520px){.grid.works{grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}}
.card small{display:block;line-height:1.45;margin-top:.15rem}
.card b{display:block;font-family:var(--display);font-weight:400;font-size:1.05rem}
.card small{color:var(--soft)}
.grid.square .ph{aspect-ratio:1;border-bottom:0}

/* board / lists */
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.search{flex:1 1 200px;display:flex;align-items:center;gap:.4rem;border:2.5px solid var(--red);border-radius:10px;padding:.3rem .7rem;background:var(--paper)}
.search input{border:0;background:transparent;width:100%;outline:none;font-size:16px}
.list{border:2.5px solid var(--red);border-radius:14px;overflow:hidden;background:var(--paper)}
.row{appearance:none;width:100%;border:0;border-bottom:2px dashed var(--line);background:transparent;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;padding:.8rem 1rem;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--yellow)}
.num{font-family:var(--pixel);font-size:.75rem;color:var(--soft);min-width:2ch}
.row b{font-family:var(--display);font-weight:400;font-size:1.05rem;display:block}
.row small{color:var(--soft)}
.row small.clip{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{font-family:var(--pixel);font-size:.72rem;color:var(--soft)}
.detail .back{margin-bottom:1rem}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.5rem;margin:.8rem 0}
.field{background:var(--yellow);border-radius:10px;padding:.5rem .75rem;font-size:.92rem}
.field span{display:block;font-size:.75rem;color:var(--soft)}
.prompt{border:2.5px solid var(--red);border-radius:12px;padding:1rem;min-height:140px;white-space:pre-wrap;word-break:break-word;color:var(--soft);background:var(--paper)}
.actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:.75rem}

/* diary */
.diary{display:grid;gap:.9rem}
.note{border:2.5px solid var(--red);border-radius:14px;background:var(--paper);padding:1rem 1.1rem;background-image:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);background-position:0 46px}
.note .d{font-family:var(--pixel);font-size:.75rem;color:var(--red)}
.note b{display:block;font-family:var(--display);font-weight:400;font-size:1.15rem}
.note p{margin:.3rem 0 0;color:var(--soft);line-height:28px}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.5rem;margin:.6rem 0 .3rem}
.pic{appearance:none;padding:0;cursor:pointer;aspect-ratio:1;border:2.5px solid var(--red);border-radius:10px;box-shadow:3px 3px 0 var(--red-deep);background:radial-gradient(circle at 25% 25%,var(--butter) 0 5px,transparent 6px) 0 0/28px 28px,var(--yellow);display:grid;place-items:center}
.pic svg{width:32px;height:32px;opacity:.5}
.pic:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--red-deep)}
@media (max-width:760px){.pics{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* guestbook */
.gb-form{display:grid;gap:.6rem;border:2.5px solid var(--red);border-radius:14px;padding:1rem;background:var(--yellow);margin-bottom:1.1rem}
.gb-form input,.gb-form textarea{width:100%;border:2px solid var(--line);border-radius:9px;background:var(--paper);padding:.55rem .7rem;font-size:16px;outline:none;resize:vertical}
.gb-form input:focus,.gb-form textarea:focus{border-color:var(--red)}
.gb-form .actions{margin:0}
.msgs{display:grid;gap:.7rem}
.msg{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:start}
.av{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--red);background:var(--yellow);display:grid;place-items:center}
.av svg{width:22px;height:22px}
.bubble{background:var(--paper);border:2px solid var(--line);border-radius:4px 14px 14px 14px;padding:.55rem .85rem}
.bubble b{font-family:var(--display);font-weight:400}
.bubble p{margin:.1rem 0 0;color:var(--soft);font-size:.95rem}

/* guestbook tree */
.tree{position:relative;width:min(440px,100%);aspect-ratio:400/320;margin:0 auto .5rem}
.tree svg{position:absolute;inset:0;width:100%;height:100%}
.gapple{appearance:none;position:absolute;width:13%;aspect-ratio:1;padding:0;border:0;background:transparent;cursor:pointer;transform:translate(-50%,-10%);transform-origin:50% 0;border-radius:50%}
.gapple svg{width:100%;height:100%;display:block}
.gapple:hover{transform:translate(-50%,-10%) rotate(-10deg)}
.gapple.on{transform:translate(-50%,-10%) scale(1.25)}
.gcard{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:center;max-width:440px;margin:0 auto 1.2rem;padding:.8rem 1rem;border:2.5px solid var(--red);border-radius:14px;background:var(--paper);box-shadow:4px 4px 0 var(--red-deep)}
.gcard.hint{display:block;text-align:center;color:var(--soft);border-style:dashed;box-shadow:none}
.gcard b{font-family:var(--display);font-weight:400;font-size:1.05rem}
.gcard p{margin:.1rem 0 0;color:var(--soft);font-size:.95rem}
.pane .gb-form{max-width:440px;margin:0 auto}
.gb-t{font-family:var(--display);font-weight:400;font-size:1.1rem;color:var(--red)}
.gb-ro{text-align:center;color:var(--soft);margin:0}
.pick{appearance:none;margin-top:.4rem;border:0;background:none;padding:0;color:var(--red);font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer}
.gcard .date{margin-left:.3rem}
.gb{display:grid;gap:.4rem}
@container (min-width:620px){
  .gb{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:1.5rem;align-items:start}
  .gb .tree{width:100%}
  .gb .gcard{margin-bottom:0}
  .pane .gb-form{max-width:none;margin:0;position:sticky;top:0}
}
@media (prefers-reduced-motion:no-preference){.gapple{transition:transform .15s}}

/* trash */
.trash-files{display:flex;flex-wrap:wrap;gap:1rem;padding:.5rem 0}
.tfile{appearance:none;border:0;background:transparent;cursor:pointer;display:grid;justify-items:center;gap:.3rem;width:110px;padding:.4rem;border-radius:12px;color:var(--ink)}
.tfile svg{width:76px;height:76px;transform:rotate(-8deg)}
.tfile span{font-family:var(--display);font-size:.95rem;padding:.05rem .45rem;border-radius:6px}
.tfile:hover span,.tfile:focus-visible span{background:var(--red);color:#fff}
.memo-wrap{display:grid;justify-items:center;gap:1.4rem;padding:1.5rem 0 .5rem}
.memo{width:min(280px,100%);aspect-ratio:1;display:grid;place-items:center;transform:rotate(-3deg);border:2px solid #E3C98F;box-shadow:5px 6px 0 rgba(163,23,44,.25);
  background:linear-gradient(135deg,rgba(0,0,0,.05) 0 1px,transparent 1px 40%,rgba(0,0,0,.04) 40% calc(40% + 1px),transparent calc(40% + 1px)),
  repeating-linear-gradient(transparent 0 31px,#F0D9A6 31px 32px),#FFF7CF}
.memo p{margin:0;font-family:var(--display);font-size:2rem;color:#D7263D;transform:rotate(2deg)}
@media (prefers-reduced-motion:no-preference){.memo{animation:unfold .3s ease-out}@keyframes unfold{from{transform:rotate(-12deg) scale(.4);opacity:0}}}
.empty{display:grid;justify-items:center;gap:.6rem;text-align:center;padding:3rem 1rem;color:var(--soft)}
.empty svg{width:72px;height:72px}

/* taskbar */
.taskbar{position:relative;display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;background:var(--red);color:#fff;border-top:3px solid var(--red-deep);z-index:10}
.start{appearance:none;display:flex;align-items:center;gap:.35rem;border:2px solid #fff;background:var(--red-deep);color:#fff;font-family:var(--pixel);font-size:.85rem;padding:.3rem .7rem;border-radius:9px;cursor:pointer}
.start svg{width:20px;height:20px}
.tasks{flex:1;min-width:0;display:flex;gap:.35rem;overflow-x:auto;scrollbar-width:none}
.tasks::-webkit-scrollbar{display:none}
.task{appearance:none;flex:none;max-width:140px;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.15);color:#fff;font-family:var(--display);font-size:.92rem;padding:.2rem .7rem;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.on{background:#fff;color:var(--red);border-color:#fff}
.task.off{opacity:.65;border-style:dashed}
.clock{font-family:var(--pixel);font-size:.85rem;padding:.25rem .5rem;border:2px solid rgba(255,255,255,.6);border-radius:8px}
.menu{position:absolute;left:.6rem;bottom:calc(100% + 6px);width:220px;background:var(--paper);border:3px solid var(--red);border-radius:12px;box-shadow:5px 5px 0 var(--red-deep);overflow:hidden;color:var(--ink)}
.menu .mh{background:var(--red);color:#fff;font-family:var(--pixel);font-size:.8rem;padding:.45rem .8rem}
.menu button{appearance:none;width:100%;border:0;border-bottom:2px dashed var(--line);background:transparent;text-align:left;padding:.6rem .85rem;font-family:var(--display);font-size:1rem;cursor:pointer;display:flex;align-items:center;gap:.55rem}
.menu button svg{width:20px;height:20px}
.menu button:hover{background:var(--yellow)}
.menu button:last-child{border-bottom:0}

/* viewer */
.viewer{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:1rem;background:rgba(59,20,24,.55);
  padding-top:calc(env(safe-area-inset-top,0px) + 1rem);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 1rem)}
.viewer .win{width:min(560px,100%);max-height:100%}
.vbody{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.6rem;padding:1rem}
.vimg{aspect-ratio:4/5;max-height:62vh;width:100%;border:2.5px solid var(--red);border-radius:12px;background:radial-gradient(circle at 25% 25%,var(--butter) 0 6px,transparent 7px) 0 0/34px 34px,var(--yellow);display:grid;place-items:center}
.vimg svg{width:60px;height:60px;opacity:.5}
.arrow{appearance:none;width:40px;height:40px;border-radius:10px;border:2.5px solid var(--red);background:var(--paper);color:var(--red);font-family:var(--pixel);cursor:pointer}
.vcap{padding:0 1rem 1rem;text-align:center}
.vcap b{font-family:var(--display);font-weight:400;font-size:1.15rem;display:block}
.vcap small{color:var(--soft)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translate(-50%,16px);background:var(--ink);color:var(--yellow);padding:.55rem 1rem;border-radius:10px;font-size:.92rem;opacity:0;pointer-events:none;transition:.2s;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- mobile ---------- */
@media (max-width:760px){
  .desk{padding:.6rem}
  .icons{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(4,1fr);justify-items:center;height:auto;gap:.6rem .2rem;padding-top:.5rem}
  .ico{width:76px}
  .ico .box{width:50px;height:50px}
  .ico .lbl{font-size:.85rem}
  .wins{inset:.5rem}
  .appwin{left:0!important;top:0!important;width:100%!important;height:100%!important;resize:none}
  .appwin.fit:not(.max){height:auto!important;max-height:100%}
  .appwin .titlebar{cursor:default}
  .appwin .tb-btn[data-act="max"]{display:none}
  .tb-btn{width:30px;height:30px}
  .pane{--pt:1.1rem;--px:1rem;--pb:1.6rem}
  .pavatar{width:160px;height:160px;margin-top:-80px}
  .pband{height:160px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
  .subtabs{display:flex}
  .subtabs button{flex:1}
  .vbody{grid-template-columns:1fr;padding:.8rem}
  .vbody .arrow{display:none}
  .vnav{display:flex!important;justify-content:center;gap:.75rem;padding:0 1rem 1rem}
}
.vnav{display:none}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="win" role="dialog" aria-labelledby="lt">
    <div class="titlebar"><span class="t" id="lt">LOGIN</span><span class="tb-btn" aria-hidden="true">×</span></div>
    <form class="login-body" id="loginForm" autocomplete="off">
      <svg class="logo" aria-hidden="true"><use href="#apple"/></svg>
      <h1>디디의 사과 상자</h1>
      <label class="lf"><span>ID</span><input id="lid" placeholder="아무거나 입력해도 돼요"></label>
      <label class="lf"><span>PASSWORD</span><input id="lpw" type="password" placeholder="••••"></label>
      <button class="pbtn" type="submit">LOGIN</button>
      <div class="status"><span id="lstat">Ready.</span><div class="meter"><i id="lbar"></i></div></div>
    </form>
  </div>
</div>

<!-- DESKTOP -->
<div class="app hidden" id="app">
  <div class="desk">
    <div class="icons" id="icons"></div>

    <div class="wins" id="wins"></div>
  </div>

  <div class="taskbar">
    <button class="start" type="button" id="start" aria-expanded="false"><svg aria-hidden="true"><use href="#apple"/></svg>START</button>
    <div class="tasks" id="tasks"></div>
    <span class="clock" id="clock">--:--</span>
    <div class="menu hidden" id="menu"><div class="mh">APPLE BOX</div></div>
  </div>
</div>

<!-- VIEWER -->
<div class="viewer hidden" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vt">
  <div class="win">
    <div class="titlebar"><span class="t" id="vt">VIEWER</span><button class="tb-btn" type="button" id="vclose" aria-label="닫기">×</button></div>
    <div class="vbody">
      <button class="arrow" type="button" data-step="-1" aria-label="이전">◀</button>
      <div class="vimg"><svg aria-hidden="true"><use href="#apple"/></svg></div>
      <button class="arrow" type="button" data-step="1" aria-label="다음">▶</button>
    </div>
    <div class="vcap"><b id="vcapT">제목</b><small id="vcapS">설명</small></div>
    <div class="vnav"><button class="arrow" type="button" data-step="-1" aria-label="이전">◀</button><button class="arrow" type="button" data-step="1" aria-label="다음">▶</button></div>
  </div>
</div>
