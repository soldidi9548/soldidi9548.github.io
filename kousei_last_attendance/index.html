<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1020">
  <title>光星高校 肝試し · 마지막 출석</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20260812-autoqueue3">
</head>
<body>
  <div class="noise"></div>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow">KOUSEI SUMMER CAMP · COURAGE TEST</div>
      <h1>最後の出席</h1>
      <p class="subtitle">마지막 출석</p>
      <p class="hero-copy">밴드 내부가 아닌 <strong>외부 브라우저</strong>로 열어 주세요.<br>접속 순서대로 4명이 자동 편성되며, 한 번에 한 팀만 진행합니다.<br><strong>공포보다는 미스터리·괴담 중심의 조사형 담력시험입니다.</strong></p>
    </header>

    <section id="authView" class="panel auth-panel">
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="player">학생</button>
        <button class="mode-tab" data-mode="gm">GM</button>
      </div>

      <div id="playerLogin" class="login-block">
        <div class="notice">본인 캐릭터 계정으로 로그인하면 자동으로 대기열에 등록됩니다.</div>
        <label>내 계정</label>
        <select id="characterSelect"></select>
        <label>사물함과 동일한 비밀번호</label>
        <input id="playerPassword" type="password" autocomplete="current-password" placeholder="비밀번호">
        <button id="playerLoginBtn" class="primary">게임방 입장</button>
      </div>

      <div id="gmLogin" class="login-block hidden">
        <label>GM 비밀번호</label>
        <input id="gmPassword" type="password" autocomplete="current-password" placeholder="gm@kousei.local 비밀번호">
        <button id="gmLoginBtn" class="primary">GM 입장</button>
        <p class="tiny">Firebase Authentication에 <code>gm@kousei.local</code> 계정을 한 번 만들어 주세요.</p>
      </div>
      <p id="authError" class="error"></p>
    </section>

    <section id="appView" class="hidden">
      <div class="statusbar panel">
        <div><span id="roleBadge" class="badge"></span> <strong id="whoAmI"></strong></div>
        <div id="connectionState" class="connection">Firebase 연결 확인 중…</div>
        <button id="logoutBtn" class="ghost small">로그아웃</button>
      </div>

      <section id="roomView" class="panel hidden">
        <div class="section-head">
          <div><span id="roomEyebrow" class="eyebrow"></span><h2 id="roomTitle"></h2></div>
        </div>
        <div id="roomBody"></div>
      </section>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="assets/js/firebase-config.js?v=20260812-autoqueue3"></script>
  <script src="assets/js/game-data.js?v=20260812-autoqueue3"></script>
  <script src="assets/js/app.js?v=20260812-autoqueue3"></script>
</body>
</html>
